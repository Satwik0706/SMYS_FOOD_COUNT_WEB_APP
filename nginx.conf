# ==============================================================================
# SMYS Food Count Portal — Production NGINX Reverse Proxy Configuration
# ==============================================================================

# Defines the upstream Node.js Express SSR cluster/instance
upstream ssr_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name smys.yourhostel.edu localhost;

    # Redirect all HTTP traffic to HTTPS in production (uncomment when SSL is installed)
    # return 301 https://$host$request_uri;

    # Root directory pointing to built client static files
    root /var/www/smys-food-count/dist/client;
    index index.html;

    # --------------------------------------------------------------------------
    # 1. Gzip Compression for Fast Mobile Cellular Delivery
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # --------------------------------------------------------------------------
    # 2. Security Headers
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --------------------------------------------------------------------------
    # 3. Direct Static Asset Serving (Bypasses Node.js for bare-metal speed)
    # --------------------------------------------------------------------------
    location /assets/ {
        alias /var/www/smys-food-count/dist/client/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # 4. PWA Service Worker & Manifest (Never aggressively cache these)
    # --------------------------------------------------------------------------
    location = /sw.js {
        root /var/www/smys-food-count/dist/client;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location = /manifest.json {
        root /var/www/smys-food-count/dist/client;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* \.(ico|svg|png|jpg|jpeg|webp)$ {
        root /var/www/smys-food-count/dist/client;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # 5. Reverse Proxy for Dynamic SSR Page Requests (Port 3000)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://ssr_backend;
        proxy_http_version 1.1;

        # WebSocket & HTTP/1.1 Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded Client Identification Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Buffer & Performance Optimizations
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_buffer_size 16k;
        proxy_busy_buffers_size 32k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        # Disable cache on dynamic SSR pages
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # --------------------------------------------------------------------------
    # 6. Block Sensitive Files
    # --------------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
